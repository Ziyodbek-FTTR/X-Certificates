<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnonBack — Anonymous Feedback. Better Healthcare.</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7faff;
            color: #102a43;
            min-height: 100vh;
        }

        .navbar {
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 70px;
            background: #ffffff;
            border-bottom: 1px solid #e8eef5;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 700;
            color: #123c78;
            letter-spacing: -0.5px;
        }

        .logo-mark {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #1261d6;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 19px;
            font-weight: 700;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-link {
            color: #52677d;
            font-size: 15px;
            text-decoration: none;
        }

        .lang-switch {
            display: flex;
            border: 1px solid #d6e1ed;
            border-radius: 9px;
            overflow: hidden;
            background: #ffffff;
        }

        .lang-btn {
            border: none;
            background: transparent;
            color: #52677d;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 13px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .lang-btn+.lang-btn {
            border-left: 1px solid #d6e1ed;
        }

        .lang-btn:hover {
            background: #f2f7fd;
        }

        .lang-btn.active,
        .lang-btn.active:hover {
            background: #1261d6;
            color: #ffffff;
        }

        .hero {
            min-height: calc(100vh - 78px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 70px;
        }

        .hero-content {
            max-width: 850px;
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 8px 15px;
            border-radius: 30px;
            background: #eaf3ff;
            color: #1261d6;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: 64px;
            line-height: 1.08;
            letter-spacing: -2.5px;
            color: #102f5b;
            margin-bottom: 24px;
        }

        .hero h1 .accent {
            color: #1261d6;
        }

        .hero p {
            max-width: 650px;
            margin: 0 auto;
            font-size: 19px;
            line-height: 1.7;
            color: #61758a;
        }

        .hero-actions {
            margin-top: 38px;
            display: flex;
            justify-content: center;
            gap: 14px;
        }

        .primary-btn,
        .submit-btn {
            border: none;
            background: #1261d6;
            color: white;
            padding: 15px 28px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .primary-btn:hover,
        .submit-btn:hover {
            background: #0d4fae;
            transform: translateY(-1px);
        }

        .secondary-btn {
            border: 1px solid #d6e1ed;
            background: white;
            color: #294763;
            padding: 15px 28px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .trust-line {
            margin-top: 45px;
            font-size: 13px;
            color: #8192a4;
        }

        .feedback-page {
            display: none;
            min-height: calc(100vh - 78px);
            padding: 50px 70px 80px;
        }

        .feedback-container {
            max-width: 760px;
            margin: 0 auto;
        }

        .back-btn {
            border: none;
            background: transparent;
            color: #52677d;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 0;
            margin-bottom: 30px;
        }

        .feedback-header {
            margin-bottom: 30px;
        }

        .feedback-header h2 {
            font-size: 42px;
            color: #102f5b;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .feedback-header p {
            color: #61758a;
            font-size: 17px;
        }

        .feedback-card {
            background: #ffffff;
            border: 1px solid #e3ebf3;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 12px 35px rgba(35, 71, 110, 0.06);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            color: #294763;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input[type="text"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            border: 1px solid #d7e2ec;
            border-radius: 9px;
            background: #fbfdff;
            color: #263f58;
            font-family: inherit;
            font-size: 15px;
            padding: 14px 15px;
            outline: none;
        }

        .form-group select,
        .form-group input[type="text"] {
            height: 50px;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
            line-height: 1.6;
        }

        .form-group select:disabled {
            background: #f1f5f9;
            color: #8192a4;
            cursor: not-allowed;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-row .form-group {
            margin-bottom: 24px;
        }

        .form-error {
            margin-bottom: 18px;
            padding: 12px 14px;
            border: 1px solid #fecdca;
            border-radius: 9px;
            background: #fef3f2;
            color: #b42318;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group input[type="text"]:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #1261d6;
            box-shadow: 0 0 0 3px rgba(18, 97, 214, 0.08);
        }

        .rating {
            display: flex;
            gap: 10px;
        }

        .rating button {
            width: 48px;
            height: 48px;
            border: 1px solid #d7e2ec;
            border-radius: 9px;
            background: #ffffff;
            color: #49647e;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .rating button:hover,
        .rating button.active {
            background: #1261d6;
            border-color: #1261d6;
            color: #ffffff;
        }

        .submit-btn {
            width: 100%;
        }

        @media (max-width: 800px) {
            .navbar {
                padding: 0 25px;
            }

            .nav-right {
                gap: 14px;
            }

            .nav-link {
                font-size: 13px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .hero {
                padding: 50px 25px;
            }

            .hero h1 {
                font-size: 45px;
            }

            .feedback-page {
                padding: 35px 25px 60px;
            }
        }

        .confirmation-card {
            text-align: center;
        }

        .confirmation-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #eaf3ff;
            color: #1769d1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
        }

        .confirmation-icon svg {
            width: 30px;
            height: 30px;
        }


        #confirmationPage {
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
        }

        #confirmationPage .confirmation-card {
            width: min(680px, 100%);
            box-sizing: border-box;
            margin: 0 auto;
        }


        #howItWorksPage {
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
        }

        #howItWorksPage .how-card {
            width: min(760px, 100%);
            box-sizing: border-box;
            margin: 0 auto;
        }

        .how-intro {
            max-width: 620px;
            margin: 0 auto 32px;
        }

        .how-steps {
            display: grid;
            gap: 16px;
            text-align: left;
            margin-bottom: 32px;
        }

        .how-step {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            padding: 18px;
            border: 1px solid #e6edf5;
            border-radius: 14px;
            background: #fbfdff;
        }

        .step-number {
            flex: 0 0 34px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #1769d1;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .how-step h3 {
            margin: 2px 0 6px;
            font-size: 17px;
        }

        .how-step p {
            margin: 0;
            color: #607086;
            line-height: 1.6;
        }


        /* Clean confirmation layout */
        #confirmationPage .confirmation-card {
            padding: 56px 64px;
            text-align: center;
        }

        #confirmationPage .confirmation-icon {
            margin-bottom: 28px;
        }

        #confirmationPage .badge {
            display: inline-block;
            margin-bottom: 22px;
        }

        #confirmationPage h2 {
            margin: 0 0 20px;
            line-height: 1.25;
        }

        #confirmationPage p {
            max-width: 560px;
            margin: 0 auto 34px;
            line-height: 1.8;
            color: #607086;
        }

        #confirmationPage .primary-btn {
            margin-top: 4px;
        }

        /* Clean How It Works layout */
        #howItWorksPage .how-card {
            padding: 52px 56px;
            text-align: center;
        }

        #howItWorksPage .badge {
            display: inline-block;
            margin-bottom: 20px;
        }

        #howItWorksPage h2 {
            margin: 0 0 18px;
            line-height: 1.25;
        }

        #howItWorksPage .how-intro {
            display: block;
            width: 100%;
            max-width: 600px;
            margin: 0 auto 36px;
            line-height: 1.8;
            color: #607086;
        }

        #howItWorksPage .how-steps {
            width: 100%;
            margin: 0 auto 34px;
            display: grid;
            gap: 18px;
            text-align: left;
        }

        #howItWorksPage .how-step {
            min-height: 72px;
            box-sizing: border-box;
            padding: 20px 22px;
            display: flex;
            align-items: flex-start;
            gap: 18px;
        }

        #howItWorksPage .step-number {
            flex-shrink: 0;
            margin-top: 2px;
        }

        #howItWorksPage .how-step h3 {
            margin: 0 0 8px;
            line-height: 1.35;
        }

        #howItWorksPage .how-step p {
            margin: 0;
            line-height: 1.65;
            color: #607086;
        }

        #howItWorksPage .primary-btn {
            margin-top: 0;
        }

        /* =====================================================
           PROVIDER LOGIN
           ===================================================== */
        #providerLoginPage {
            width: 100%;
            min-height: calc(100vh - 78px);
            box-sizing: border-box;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
        }

        .login-card {
            width: min(440px, 100%);
            box-sizing: border-box;
            background: #ffffff;
            border: 1px solid #e3ebf3;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 12px 35px rgba(35, 71, 110, 0.06);
        }

        .login-card h2 {
            font-size: 28px;
            color: #102f5b;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .login-card>p {
            color: #61758a;
            font-size: 14px;
            margin-bottom: 26px;
        }

        .prototype-note {
            margin-top: 18px;
            padding: 12px 14px;
            border: 1px solid #ffe1a8;
            border-radius: 9px;
            background: #fff8ea;
            color: #8a5a00;
            font-size: 13px;
            line-height: 1.5;
        }

        .demo-hint {
            margin-top: 12px;
            font-size: 12px;
            color: #8192a4;
        }

        /* =====================================================
           PROVIDER DASHBOARD
           ===================================================== */
        #providerDashboard {
            display: none;
            min-height: calc(100vh - 78px);
        }

        .dashboard-shell {
            display: flex;
            align-items: stretch;
            min-height: calc(100vh - 78px);
        }

        .dashboard-sidebar {
            width: 240px;
            flex-shrink: 0;
            background: #ffffff;
            border-right: 1px solid #e8eef5;
            padding: 28px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .dash-tab-btn {
            display: block;
            width: 100%;
            text-align: left;
            border: none;
            background: transparent;
            color: #52677d;
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 600;
            padding: 12px 14px;
            border-radius: 9px;
            cursor: pointer;
        }

        .dash-tab-btn:hover {
            background: #f2f7fd;
        }

        .dash-tab-btn.active {
            background: #eaf3ff;
            color: #1261d6;
        }

        .dashboard-main {
            flex: 1;
            padding: 32px 40px 60px;
            min-width: 0;
        }

        .dash-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 26px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .dash-topbar h2 {
            font-size: 26px;
            color: #102f5b;
            letter-spacing: -0.5px;
        }

        .demo-badge {
            display: inline-flex;
            align-items: center;
            padding: 5px 12px;
            border-radius: 20px;
            background: #fff2e0;
            color: #a35b00;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .logout-btn {
            border: 1px solid #d6e1ed;
            background: #ffffff;
            color: #294763;
            padding: 10px 18px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #f2f7fd;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        .stat-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #ffffff;
            border: 1px solid #e3ebf3;
            border-radius: 14px;
            padding: 20px;
        }

        .stat-card .stat-label {
            font-size: 13px;
            color: #7488a0;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .stat-card .stat-value {
            font-size: 30px;
            font-weight: 700;
            color: #102f5b;
        }

        .stat-card.negative .stat-value {
            color: #b42318;
        }

        .stat-card.positive .stat-value {
            color: #16794c;
        }

        .stat-card.priority .stat-value {
            color: #a35b00;
        }

        .panel-card {
            background: #ffffff;
            border: 1px solid #e3ebf3;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .panel-card h3 {
            font-size: 17px;
            color: #102f5b;
            margin-bottom: 16px;
        }

        .ai-disclaimer {
            padding: 14px 16px;
            border: 1px solid #d6e1ed;
            border-radius: 10px;
            background: #f2f7fd;
            color: #294763;
            font-size: 13.5px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        .filter-bar input,
        .filter-bar select {
            border: 1px solid #d7e2ec;
            border-radius: 8px;
            background: #fbfdff;
            color: #263f58;
            font-family: inherit;
            font-size: 13.5px;
            padding: 9px 11px;
            height: 40px;
        }

        .filter-bar input[type="text"] {
            min-width: 200px;
            flex: 1 1 200px;
        }

        .filter-bar input[type="date"] {
            min-width: 140px;
        }

        .filter-reset-btn {
            border: 1px solid #d6e1ed;
            background: #ffffff;
            color: #52677d;
            font-size: 13.5px;
            font-weight: 600;
            border-radius: 8px;
            padding: 9px 14px;
            cursor: pointer;
            height: 40px;
        }

        .results-count {
            font-size: 13px;
            color: #7488a0;
            margin-bottom: 14px;
        }

        .data-table-wrap {
            overflow-x: auto;
        }

        table.data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }

        table.data-table th {
            text-align: left;
            padding: 10px 12px;
            color: #7488a0;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 1px solid #e8eef5;
            white-space: nowrap;
        }

        table.data-table td {
            padding: 12px;
            border-bottom: 1px solid #eef3f8;
            color: #294763;
            white-space: nowrap;
        }

        table.data-table td.wrap {
            white-space: normal;
            max-width: 260px;
        }

        .pill {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .pill-positive {
            background: #e6f6ee;
            color: #16794c;
        }

        .pill-neutral {
            background: #f0f2f5;
            color: #52677d;
        }

        .pill-negative {
            background: #fef3f2;
            color: #b42318;
        }

        .pill-high {
            background: #fef3f2;
            color: #b42318;
        }

        .pill-medium {
            background: #fff8ea;
            color: #8a5a00;
        }

        .pill-low {
            background: #eaf3ff;
            color: #1261d6;
        }

        .pill-planned {
            background: #f0f2f5;
            color: #52677d;
        }

        .pill-in-progress {
            background: #eaf3ff;
            color: #1261d6;
        }

        .pill-implemented {
            background: #e6f6ee;
            color: #16794c;
        }

        .view-btn {
            border: 1px solid #d6e1ed;
            background: #ffffff;
            color: #1261d6;
            font-size: 12.5px;
            font-weight: 700;
            border-radius: 7px;
            padding: 6px 12px;
            cursor: pointer;
        }

        .view-btn:hover {
            background: #eaf3ff;
        }

        .empty-state {
            padding: 30px 10px;
            text-align: center;
            color: #7488a0;
            font-size: 14px;
        }

        .bar-row {
            display: grid;
            grid-template-columns: 170px 1fr 60px;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 13.5px;
        }

        .bar-row .bar-name {
            color: #294763;
            font-weight: 600;
        }

        .bar-track {
            height: 10px;
            border-radius: 6px;
            background: #eef3f8;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: #1261d6;
            border-radius: 6px;
        }

        .bar-row .bar-value {
            text-align: right;
            color: #7488a0;
            font-weight: 600;
        }

        .insight-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .insight-list li {
            padding: 10px 0;
            border-bottom: 1px solid #eef3f8;
            font-size: 14px;
            color: #294763;
        }

        .insight-list li:last-child {
            border-bottom: none;
        }

        .trend-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .trend-card .trend-periods {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 13px;
            color: #7488a0;
        }

        .trend-card .trend-delta {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 700;
        }

        .trend-delta.up-bad {
            color: #b42318;
        }

        .trend-delta.up-good {
            color: #16794c;
        }

        .trend-delta.down-good {
            color: #16794c;
        }

        .trend-delta.down-bad {
            color: #b42318;
        }

        .trend-delta.flat {
            color: #7488a0;
        }

        .action-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 8px;
        }

        .action-form .full {
            grid-column: 1 / -1;
        }

        .action-form label {
            display: block;
            margin-bottom: 7px;
            color: #294763;
            font-size: 13px;
            font-weight: 600;
        }

        .action-form input,
        .action-form select,
        .action-form textarea {
            width: 100%;
            border: 1px solid #d7e2ec;
            border-radius: 8px;
            background: #fbfdff;
            color: #263f58;
            font-family: inherit;
            font-size: 14px;
            padding: 10px 12px;
            box-sizing: border-box;
        }

        .action-form textarea {
            min-height: 80px;
            resize: vertical;
        }

        .action-card {
            border: 1px solid #e3ebf3;
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 12px;
        }

        .action-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .action-card-head .action-cat {
            font-weight: 700;
            color: #102f5b;
        }

        .action-card p {
            color: #61758a;
            font-size: 13.5px;
            margin-bottom: 6px;
            line-height: 1.5;
        }

        .action-date {
            font-size: 12.5px;
            color: #8192a4;
        }

        .correlation-note {
            margin-top: 8px;
            font-size: 12.5px;

            background: #f7faff;
            border: 1px solid #e8eef5;

            padding: 8px 10px;
        }

        /* Feedback detail modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(16, 42, 67, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 50;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            width: min(560px, 100%);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-card h3 {
            font-size: 20px;
            color: #102f5b;
            margin-bottom: 18px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            padding: 9px 0;
            border-bottom: 1px solid #eef3f8;
            font-size: 13.5px;
        }

        .detail-row .detail-label {
            color: #7488a0;
            font-weight: 600;
            flex-shrink: 0;
        }

        .detail-row .detail-value {
            color: #263f58;
            text-align: right;
        }

        .detail-text-block {
            margin-top: 14px;
            padding: 12px 14px;
            background: #f7faff;
            border-radius: 10px;
            font-size: 14px;
            color: #294763;
            line-height: 1.6;
        }

        .modal-close-btn {
            margin-top: 20px;
            width: 100%;
        }

        @media (max-width: 900px) {
            .dashboard-shell {
                flex-direction: column;
            }

            .dashboard-sidebar {
                width: 100%;
                flex-direction: row;
                overflow-x: auto;
                border-right: none;
                border-bottom: 1px solid #e8eef5;
            }

            .dashboard-main {
                padding: 24px 20px 50px;
            }

            .action-form {
                grid-template-columns: 1fr;
            }

            .bar-row {
                grid-template-columns: 120px 1fr 50px;
            }
        }

</head>

        function slug(text) {
            return text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
        }

        // District (tuman): uz name, ru adjective, en name
        function D(uz, ru, en) {
            return {

                name: {uz: uz + " tumani", ru: ru + " район", en: en + " District"},
                sort: {uz: uz, ru: ru, en: en}
            };
        }

            return {
                id: slug(en) + "-city",
                name: {uz: uz + " shahri", ru: "город " + ru, en: en + " City"},
                sort: {uz: uz, ru: ru, en: en}
            };
        }

        function regionLabel(regionId) {
            const region = findRegion(regionId);
            return region ? region.name[currentLang] : regionId;
        }

        function districtLabel(regionId, districtId) {
            const region = findRegion(regionId);
            if (!region) return districtId;
            const district = region.districts.find(function (d) {return d.id === districtId;});
            return district ? district.name[currentLang] : districtId;
        }

        /* =====================================================
           AI ANALYSIS (rule-based, on-device)
           AnonBack's AI analyzes feedback about the *service*,
           never the patient. It does not diagnose, prescribe,
           recommend treatment or make clinical decisions.
           ===================================================== */
        function deriveSentiment(rating) {
            if (rating <= 2) return "negative";
            if (rating === 3) return "neutral";
            return "positive";
        }

        function derivePriority(rating) {
            if (rating <= 2) return "high";
            if (rating === 3) return "medium";
            return "low";
        }

        function aiSummaryFor(item) {
            const sentiment = deriveSentiment(item.rating);
            return t("ai.summaryTemplate", {
                sentiment: t("sentiment." + sentiment),
                category: categoryLabel(item.category)
            });
        }

        function computeStats(dataset) {
            const total = dataset.length;
            let ratingSum = 0, positive = 0, negative = 0, highPriority = 0;
            dataset.forEach(function (item) {
                ratingSum += item.rating;
                const sentiment = deriveSentiment(item.rating);
                if (sentiment === "positive") positive++;
                if (sentiment === "negative") negative++;
                if (derivePriority(item.rating) === "high") highPriority++;
            });
            return {
                total: total,
                avgRating: total ? (ratingSum / total) : 0,
                positive: positive,
                negative: negative,
                positivePct: total ? Math.round((positive / total) * 100) : 0,
                negativePct: total ? Math.round((negative / total) * 100) : 0,
                highPriority: highPriority
            };
        }

        function categoryCounts(dataset) {
            const counts = {};
            CATEGORY_IDS.forEach(function (id) {counts[id] = 0;});
            dataset.forEach(function (item) {
                counts[item.category] = (counts[item.category] || 0) + 1;
            });
            return CATEGORY_IDS.map(function (id) {
                return {id: id, label: categoryLabel(id), count: counts[id]};
            });
        }

        function topCategory(dataset) {
            const counts = categoryCounts(dataset);
            return counts.reduce(function (best, row) {
                return (!best || row.count > best.count) ? row : best;
            }, null);
        }

        /* =====================================================
           SIMPLE BAR CHART RENDERER (no external chart library)
           rows: [{ label, count, display }]. Bars are sized
           relative to the largest count in the list.
           ===================================================== */
        function renderBars(containerId, rows) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const maxCount = rows.reduce(function (m, r) {return Math.max(m, r.count);}, 0) || 1;

            if (rows.length === 0 || maxCount === 0) {
                container.innerHTML = '<div class="empty-state">' + t("common.noResults") + "</div>";
                return;
            }

            container.innerHTML = rows.map(function (row) {
                const pct = Math.round((row.count / maxCount) * 100);
                const display = row.display !== undefined ? row.display : row.count;
                return '<div class="bar-row">' +
                    '<span class="bar-name">' + escapeHtml(row.label) + '</span>' +
                    '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
                    '<span class="bar-value">' + escapeHtml(String(display)) + '</span>' +
                    '</div>';
            }).join("");
        }

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }

        function applyFilters(dataset) {
            const search = document.getElementById("filterSearch").value.trim().toLowerCase();
            const category = document.getElementById("filterCategory").value;
            const rating = document.getElementById("filterRating").value;
            const sentiment = document.getElementById("filterSentiment").value;
            const priority = document.getElementById("filterPriority").value;
            const region = document.getElementById("filterRegion").value;
            const district = document.getElementById("filterDistrict").value;
            const dateFrom = document.getElementById("filterDateFrom").value;
            const dateTo = document.getElementById("filterDateTo").value;

            return dataset.filter(function (item) {
                if (search && (item.hospital + " " + item.text).toLowerCase().indexOf(search) === -1) return false;
                if (category && item.category !== category) return false;
                if (rating && String(item.rating) !== rating) return false;
                if (sentiment && deriveSentiment(item.rating) !== sentiment) return false;
                if (priority && derivePriority(item.rating) !== priority) return false;
                if (region && item.region !== region) return false;
                if (district && item.district !== district) return false;
                if (dateFrom && item.date < dateFrom) return false;
                if (dateTo && item.date > dateTo) return false;
                return true;
            });
        }

        function daysAgoISO(days) {
            const d = new Date();
            d.setDate(d.getDate() - days);
            return d.toISOString().slice(0, 10);
        }

        function renderTrendDelta(elementId, currentValue, previousValue, higherIsBad) {
            const el = document.getElementById(elementId);
            const diff = currentValue - previousValue;
            if (previousValue === 0 && currentValue === 0) {
                el.textContent = t("common.notEnoughData");
                el.className = "trend-delta flat";
                return;
            }
            const arrow = diff > 0 ? "\u25B2" : (diff < 0 ? "\u25BC" : "\u2013");
            const pctText = previousValue !== 0 ? Math.round((diff / previousValue) * 100) + "%" : "";
            el.textContent = arrow + " " + (pctText || diff.toFixed(1)) + " " + t("trends.vsPrevious");

            let cls = "flat";
            if (diff > 0) cls = higherIsBad ? "up-bad" : "up-good";
            if (diff < 0) cls = higherIsBad ? "down-good" : "down-bad";
            el.className = "trend-delta " + cls;
        }

        function renderTrendsTab() {
            const dataset = getAllFeedback();
            const currFrom = daysAgoISO(30);
            const prevFrom = daysAgoISO(60);

            const currSet = dataset.filter(function (i) {return i.date >= currFrom;});
            const prevSet = dataset.filter(function (i) {return i.date >= prevFrom && i.date < currFrom;});

            const currStats = computeStats(currSet);
            const prevStats = computeStats(prevSet);

            document.getElementById("trendVolumeCurr").textContent = t("trends.last30") + ": " + currStats.total;
            document.getElementById("trendVolumePrev").textContent = t("trends.previous30") + ": " + prevStats.total;
            renderTrendDelta("trendVolumeDelta", currStats.total, prevStats.total, false);

            document.getElementById("trendRatingCurr").textContent = t("trends.last30") + ": " + (currStats.total ? currStats.avgRating.toFixed(1) : "0.0");
            document.getElementById("trendRatingPrev").textContent = t("trends.previous30") + ": " + (prevStats.total ? prevStats.avgRating.toFixed(1) : "0.0");
            renderTrendDelta("trendRatingDelta", currStats.avgRating, prevStats.avgRating, false);

            document.getElementById("trendNegCurr").textContent = t("trends.last30") + ": " + currStats.negativePct + "%";
            document.getElementById("trendNegPrev").textContent = t("trends.previous30") + ": " + prevStats.negativePct + "%";
            renderTrendDelta("trendNegDelta", currStats.negativePct, prevStats.negativePct, true);

            const currCats = categoryCounts(currSet);
            const prevCats = categoryCounts(prevSet);
            const rows = CATEGORY_IDS.map(function (id, idx) {
                const currCount = currCats[idx].count;
                const prevCount = prevCats[idx].count;
                const diff = currCount - prevCount;
                const arrow = diff > 0 ? "\u25B2" : (diff < 0 ? "\u25BC" : "\u2013");
                return "<div class=\"bar-row\"><span class=\"bar-name\">" + escapeHtml(categoryLabel(id)) +
                    "</span><span style=\"color:#7488a0;\">" + t("trends.previous30") + ": " + prevCount + " &rarr; " + t("trends.last30") + ": " + currCount +
                    "</span><span class=\"bar-value\">" + arrow + "</span></div>";
            }).join("");
            document.getElementById("trendCategoryTable").innerHTML = rows;

            renderBars("trendVolumeBars", monthlyVolume(dataset));
        }

        /* =====================================================
           ACTIONS TAB
           ===================================================== */
        function initActionForm() {
            populateActionCategoryOptions();
            document.getElementById("actionDate").value = todayISO();
        }

        function populateActionCategoryOptions() {
            const select = document.getElementById("actionCategory");
            const prev = select.value;
            select.innerHTML = "";
            CATEGORY_IDS.forEach(function (id) {
                appendOption(select, id, categoryLabel(id));
            });
            select.value = CATEGORY_IDS.indexOf(prev) !== -1 ? prev : CATEGORY_IDS[0];
        }

        function showActionError(key) {
            const box = document.getElementById("actionError");
            if (key) {
                box.textContent = t(key);
                box.hidden = false;
            } else {
                box.textContent = "";
                box.hidden = true;
            }
        }

        function saveAction() {
            const category = document.getElementById("actionCategory").value;
            const description = document.getElementById("actionDescription").value.trim();
            const status = document.getElementById("actionStatus").value;
            const date = document.getElementById("actionDate").value;

            if (!category || !description || !status || !date) {
                showActionError("actions.errorIncomplete");
                return;
            }

            showActionError(null);

            const actions = loadActions();
            actions.push({id: "a-" + Date.now(), category: category, description: description, status: status, date: date});
            saveActions(actions);

            document.getElementById("actionDescription").value = "";
            document.getElementById("actionDate").value = todayISO();

            renderActionsTab();
        }

        function actionCorrelationNote(action) {
            const dataset = getAllFeedback().filter(function (i) {return i.category === action.category;});
            const before = dataset.filter(function (i) {return i.date < action.date;});
            const after = dataset.filter(function (i) {return i.date >= action.date;});

            if (before.length === 0 || after.length === 0) {
                return t("common.notEnoughData");
            }

            const beforeNegRate = before.filter(function (i) {return deriveSentiment(i.rating) === "negative";}).length / before.length;
            const afterNegRate = after.filter(function (i) {return deriveSentiment(i.rating) === "negative";}).length / after.length;

            const key = afterNegRate < beforeNegRate ? "actions.correlationDecrease" : "actions.correlationNoDecrease";
            return t(key, {category: categoryLabel(action.category)});
        }

        function renderActionsTab() {
            const actions = getAllActions().slice().sort(function (a, b) {return b.date.localeCompare(a.date);});
            const list = document.getElementById("actionsList");

            if (actions.length === 0) {
                list.innerHTML = '<div class="empty-state">' + t("actions.empty") + "</div>";
                return;
            }

            list.innerHTML = actions.map(function (action) {
                return '<div class="action-card">' +
                    '<div class="action-card-head">' +
                    '<span class="action-cat">' + escapeHtml(categoryLabel(action.category)) + "</span>" +
                    '<span class="pill pill-' + action.status + '">' + t("status." + toCamel(action.status)) + "</span>" +
                    "</div>" +
                    "<p>" + escapeHtml(action.description) + "</p>" +
                    '<div class="action-date">' + action.date + "</div>" +
                    '<div class="correlation-note">' + escapeHtml(actionCorrelationNote(action)) + "</div>" +
                    "</div>";
            }).join("");
        }

        function toCamel(status) {
            if (status === "in-progress") return "inProgress";
            return status;
        }

        /* =====================================================
           LANGUAGE SYSTEM
           ===================================================== */
        const STORAGE_KEY = "anonback_lang";
        const DEFAULT_LANG = "uz";
        let currentLang = DEFAULT_LANG;
        let currentErrorKey = null;
        let selectedRating = 0;

        function t(key, params) {
            const dict = translations[currentLang] || {};
            let text = dict[key];
            if (text === undefined) text = translations.en[key];
            if (text === undefined) text = key;
            if (params) {
                Object.keys(params).forEach(function (name) {
                    text = text.replace("{" + name + "}", params[name]);
                });
            }
            return text;
        }

        function readStoredLang() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored && translations[stored]) return stored;
            } catch (e) { /* storage unavailable */}
            return DEFAULT_LANG;
        }

        function storeLang(lang) {
            try {
                localStorage.setItem(STORAGE_KEY, lang);
            } catch (e) { /* storage unavailable */}
        }

        // Applies translations to every marked element inside root.
        // Can be called again for dynamically added markup.
        function applyTranslations(root) {
            root = root || document;
            root.querySelectorAll("[data-i18n]").forEach(function (el) {
                el.textContent = t(el.getAttribute("data-i18n"));
            });
            root.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
                el.setAttribute("placeholder", t(el.getAttribute("data-i18n-placeholder")));
            });
            root.querySelectorAll("[data-i18n-title]").forEach(function (el) {
                el.setAttribute("title", t(el.getAttribute("data-i18n-title")));
            });
            root.querySelectorAll("[data-i18n-aria-label]").forEach(function (el) {
                el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria-label")));
            });
        }

        function setLanguage(lang) {
            if (!translations[lang]) lang = DEFAULT_LANG;
            currentLang = lang;
            storeLang(lang);

            document.documentElement.lang = lang;
            document.title = t("meta.title");

            applyTranslations();
            renderRegions();
            renderDistricts(true);
            renderRatingTitles();
            renderError();

            document.querySelectorAll(".lang-btn").forEach(function (btn) {
                const active = btn.getAttribute("data-lang") === lang;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-pressed", active ? "true" : "false");
            });

            refreshDashboardIfVisible();
            if (lastOpenedFeedbackId) openFeedbackDetail(lastOpenedFeedbackId);
        }

        /* =====================================================
           REGION / DISTRICT
           ===================================================== */
        function findRegion(id) {
            return locations.regions.find(function (r) {return r.id === id;}) || null;
        }

        function appendOption(select, value, text) {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = text;
            select.appendChild(option);
        }

        function renderRegions() {
            const select = document.getElementById("region");
            const previous = select.value;

            const pinned = locations.pinned.map(findRegion);
            const others = locations.regions
                .filter(function (r) {return locations.pinned.indexOf(r.id) === -1;})
                .sort(function (a, b) {return a.name[currentLang].localeCompare(b.name[currentLang], currentLang);});

            select.innerHTML = "";
            appendOption(select, "", t("fb.regionPh"));
            pinned.concat(others).forEach(function (region) {
                appendOption(select, region.id, region.name[currentLang]);
            });

            select.value = findRegion(previous) ? previous : "";
        }

        function renderDistricts(keepSelection) {
            const regionSelect = document.getElementById("region");
            const select = document.getElementById("district");
            const region = findRegion(regionSelect.value);
            const previous = keepSelection ? select.value : "";

            select.innerHTML = "";

            if (!region) {
                appendOption(select, "", t("fb.districtPhDisabled"));
                select.disabled = true;
                select.value = "";
                return;
            }

            appendOption(select, "", t("fb.districtPh"));
            region.districts
                .slice()
                .sort(function (a, b) {
                    return a.sort[currentLang].localeCompare(b.sort[currentLang], currentLang) ||
                        a.id.localeCompare(b.id);
                })
                .forEach(function (district) {
                    appendOption(select, district.id, district.name[currentLang]);
                });

            select.disabled = false;

            const stillValid = region.districts.some(function (d) {return d.id === previous;});
            select.value = stillValid ? previous : "";
        }

        /* =====================================================
           FORM HELPERS
           ===================================================== */
        function renderRatingTitles() {
            document.querySelectorAll(".rating button").forEach(function (button) {
                const n = button.getAttribute("data-rating");
                button.setAttribute("title", t("fb.ratingTitle", {n: n}));
                button.setAttribute("aria-label", t("fb.ratingTitle", {n: n}));
            });
        }

        function showError(key) {
            currentErrorKey = key;
            renderError();
        }

        function renderError() {
            const box = document.getElementById("formError");
            if (currentErrorKey) {
                box.textContent = t(currentErrorKey);
                box.hidden = false;
            } else {
                box.textContent = "";
                box.hidden = true;
            }
        }

        /* =====================================================
           EXISTING NAVIGATION AND FORM LOGIC
           ===================================================== */
        function showFeedback() {
            hideAllPages();
            document.getElementById("feedbackPage").style.display = "block";
            window.scrollTo(0, 0);
        }


        function showHome() {
            hideAllPages();
            document.getElementById("home").style.display = "flex";
            window.scrollTo(0, 0);
        }

        function showConfirmation() {
            hideAllPages();
            document.getElementById("confirmationPage").style.display = "flex";
            window.scrollTo(0, 0);
        }

        function setRating(rating) {
            selectedRating = rating;

            const buttons = document.querySelectorAll(".rating button");

            buttons.forEach(function (button, index) {
                button.classList.toggle("active", index < rating);
            });
        }

        function submitFeedback() {
            const hospitalName = document.getElementById("hospital").value; // stored exactly as entered
            const region = document.getElementById("region").value;
            const district = document.getElementById("district").value;
            const feedback = document.getElementById("feedbackText").value.trim();
            const category = document.getElementById("category").value;

            const regionData = findRegion(region);
            const districtValid = !!regionData && regionData.districts.some(function (d) {return d.id === district;});
            const hospitalValid = hospitalName.trim().length > 0;

            if (regionData && districtValid && !hospitalValid && feedback && category && selectedRating > 0) {
                showError("fb.errorHospital");
                return;
            }

            if (!regionData || !districtValid || !hospitalValid || !feedback || !category || selectedRating === 0) {
                showError("fb.errorIncomplete");
                return;
            }

            showError(null);

            // Prototype data layer: store the anonymous submission locally so it
            // becomes available to the provider dashboard (see getAllFeedback()).
            // No patient identity fields (name, phone, email, ID) are collected or stored.
            const stored = loadPatientFeedback();
            stored.push({
                id: "p-" + Date.now(),
                hospital: hospitalName.trim(),
                region: region,
                district: district,
                category: category,
                rating: selectedRating,
                text: feedback,
                date: todayISO()
            });
            savePatientFeedback(stored);

            document.getElementById("region").value = "";
            renderDistricts(false);
            document.getElementById("hospital").value = "";
            document.getElementById("feedbackText").value = "";
            document.getElementById("category").value = "";

            setRating(0);
            showConfirmation();
        }
        function learnMore() {
            hideAllPages();
            document.getElementById("howItWorksPage").style.display = "flex";
            window.scrollTo(0, 0);
        }

        /* =====================================================
           INIT
           ===================================================== */
        document.querySelectorAll(".lang-btn").forEach(function (btn) {
            btn.addEventListener("click", function () {
                setLanguage(btn.getAttribute("data-lang"));
            });
        });

        // Changing region always clears the district
        document.getElementById("region").addEventListener("change", function () {
            renderDistricts(false);
        });

        // Hide the validation message as soon as the user edits the form
        document.getElementById("feedbackCard").addEventListener("input", function () {
            if (currentErrorKey) showError(null);
        });
        document.getElementById("feedbackCard").addEventListener("change", function () {
            if (currentErrorKey) showError(null);
        });

        setLanguage(readStoredLang());
    </script>

</body>
